name: verify

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false # the gates only read Python tooling, not binary assets
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.11.7"
      - name: Verify
        shell: pwsh
        run: ./Tools/verify.ps1
